name: Build Oafish Grass Runtime

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*", "ogr-v*" ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download X-Plane SDK 4.3.0
        shell: bash
        run: |
          curl -fL --retry 3 -o sdk.zip https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip
          unzip -q sdk.zip -d sdk

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DXPLANE_SDK_ROOT="$PWD/sdk/SDK"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test grass, replay, traffic, LOD, wheel tracks and direct DSF parser
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test WED area exporter fallback
        run: python tests/test_wed_extract.py

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/OafishGrassRuntime/win_x64 | Out-Null
          New-Item -ItemType Directory -Force package/WED-Starter | Out-Null
          New-Item -ItemType Directory -Force package/OafishGrass_Library/OafishGrass | Out-Null

          $xpl = Get-ChildItem -Recurse build -Filter OafishGrassRuntime.xpl | Select-Object -First 1
          if (-not $xpl) { throw "OafishGrassRuntime.xpl not found" }
          Copy-Item $xpl.FullName package/OafishGrassRuntime/win_x64/OafishGrassRuntime.xpl
          Copy-Item README.md,START-HERE.txt package/OafishGrassRuntime/

          Copy-Item -Recurse release/WED-Starter/OafishGrass package/WED-Starter/OafishGrass

          Copy-Item release/OafishGrass_Library/library.txt package/OafishGrass_Library/library.txt
          Copy-Item release/OafishGrass_Library/README.txt package/OafishGrass_Library/README.txt
          Copy-Item release/WED-Starter/OafishGrass/ogr_grass.for package/OafishGrass_Library/OafishGrass/ogr_grass.for
          Copy-Item release/WED-Starter/OafishGrass/grass_A.obj package/OafishGrass_Library/OafishGrass/grass_A.obj
          Copy-Item release/WED-Starter/OafishGrass/grass_B.obj package/OafishGrass_Library/OafishGrass/grass_B.obj
          Copy-Item release/WED-Starter/OafishGrass/grass_C.obj package/OafishGrass_Library/OafishGrass/grass_C.obj
          Copy-Item release/WED-Starter/OafishGrass/grass_atlas.png package/OafishGrass_Library/OafishGrass/grass_atlas.png
          Copy-Item release/WED-Starter/OafishGrass/ogr_marker.png package/OafishGrass_Library/OafishGrass/ogr_marker.png

          # Blender-exported grass carries the original 914.4 m object gate.
          # Runtime instance count stays capped while sparse far-ring instances
          # are allowed to remain visible through OGR's 2 km LOD.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $lodObjects = Get-ChildItem package -Recurse -Filter "grass_*.obj"
          foreach ($obj in $lodObjects) {
            $text = [IO.File]::ReadAllText($obj.FullName)
            $patched = [regex]::Replace($text, 'ATTR_LOD\s+0\s+914\.4', "ATTR_LOD`t0`t2050")
            if ($patched -eq $text) { throw "Expected 914.4 m ATTR_LOD not found in $($obj.FullName)" }
            [IO.File]::WriteAllText($obj.FullName, $patched, $utf8NoBom)
          }

          Compress-Archive -Path package/* -DestinationPath "OGR-v0.6.5-win_x64-build-${{ github.run_number }}.zip" -Force

      - name: Publish directly to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ogr-v0.6.5-build-${{ github.run_number }}"
          gh release create "$TAG" \
            "OGR-v0.6.5-win_x64-build-${{ github.run_number }}.zip" \
            --title "Oafish Grass Runtime v0.6.5 Windows Build #${{ github.run_number }}" \
            --notes "Stationary-contact wheel fix: grass now stays flattened to about 90 degrees for as long as a user-aircraft tire remains physically on it, even when the aircraft is completely stopped. Movement is used only to remember the natural flattening direction; when the aircraft stops, that last direction is held instead of letting the grass stand back up. Recovery begins only after the wheel moves away or loses ground contact, keeping the existing 5.5-second recovery behavior. 2 km three-stage LOD, shared library, 10,000 streamed candidates, Direct DSF parsing, replay-aware RPM/N1 wash and TCAS/IVAO/VATSIM traffic interaction remain enabled."